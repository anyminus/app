name: iOS Hybrid
on:
  push:
    branches: [ios-audio-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: pod --version
      - run: npm run ios:prepare
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
          VITE_TELEGRAM_MINI_APP_URL: ${{ vars.TELEGRAM_MINI_APP_URL }}
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.1.1 CURRENT_PROJECT_VERSION=${{ github.run_number }} -derivedDataPath ios-build build
      - uses: actions/upload-artifact@v4
        with:
          name: AnyMinus-iOS-simulator
          path: ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
