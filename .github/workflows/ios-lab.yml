name: iOS Audio Lab
on:
  push:
    branches: [ios-audio-lab]
    paths: ['ios-lab/**', '.github/workflows/ios-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios-lab
      - run: xcodebuild -project ios-lab/AnyMinusAudioLab.xcodeproj -scheme AnyMinusAudioLab -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
