name: Prototype CI and Pages
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Probe public artwork (non-blocking)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/check-public-artwork.mjs
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - name: Diagnose artist catalog (read-only)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Artist')
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/check-artist-catalog.mjs
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - name: Diagnose reported track 108591168 (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/check-reported-track.mjs
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - run: npm run build
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
          VITE_TELEGRAM_MINI_APP_URL: ${{ vars.TELEGRAM_MINI_APP_URL }}
      - name: Install Chromium and test dependencies
        run: |
          for source in /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com/ubuntu/' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: production-build
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/prototype/') && github.event_name != 'pull_request'
        with:
          name: preview-build
          path: dist
  previews:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build explicitly allowed preview branches
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
          VITE_TELEGRAM_MINI_APP_URL: ${{ vars.TELEGRAM_MINI_APP_URL }}
        run: node scripts/build-pages-previews.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: preview-sites
          path: pages-previews
          include-hidden-files: true
  assemble:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, previews]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: preview-sites
          path: previews
      - name: Combine without changing production files
        run: |
          test -f site/index.html
          test ! -e site/prototype
          test -d previews/prototype
          cp -a previews/prototype site/prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish explicitly documented version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          notes="docs/releases/$tag.md"
          if [[ ! -s "$notes" ]]; then
            echo "No release notes for $tag; skip GitHub release."
            exit 0
          fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists; not changing it."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists without a release; verify target manually."
            exit 1
          else
            status=$?
            [[ "$status" -eq 2 ]] || exit "$status"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "AnyMinus $version" --notes-file "$notes" --latest
