name: Prototype CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Probe public artwork (non-blocking)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/check-public-artwork.mjs
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - name: Diagnose artist catalog (read-only)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Artist catalog')
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/check-artist-catalog.mjs
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - run: npm run build
        env:
          VITE_DEMO_API_ORIGIN: ${{ vars.DEMO_API_ORIGIN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
